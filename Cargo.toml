[workspace]
resolver = "2"
members = [
    "crates/obd2-db",
    "crates/obd2-dash",
    "apps/obd2-gui/src-tauri",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
