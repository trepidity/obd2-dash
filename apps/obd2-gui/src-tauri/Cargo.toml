[package]
name = "obd2-gui"
version = "0.1.0"
description = "Tauri shell for OBD-II diagnostics"
authors = ["HaulLogic"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
obd2-dash = { path = "../../../crates/obd2-dash" }
obd2-core = { workspace = true, features = ["serial", "embedded-specs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
